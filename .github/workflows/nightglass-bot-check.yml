name: Nightglass Bot Check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NIGHTGLASS_APP_ID }}
          private-key: ${{ secrets.NIGHTGLASS_APP_PRIVATE_KEY }}
          owner: Nightglass-Labs
          repositories: plantingtulips
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Get GitHub App bot user ID
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          BOT_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "id=$BOT_ID" >> "$GITHUB_OUTPUT"

      - name: Configure bot Git identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_ID: ${{ steps.bot.outputs.id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          git config user.name
          git config user.email

      - name: Create verification commit
        run: |
          mkdir -p .github
          date -u +"Nightglass bot verified at %Y-%m-%dT%H:%M:%SZ" > .github/nightglass-bot-verified.txt

          git add .github/nightglass-bot-verified.txt
          git commit -m "chore: verify Nightglass bot identity"
          git push
