name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '11 9 * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run strict production smoke
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REQUIRE_CATALOG: '1'
          REQUIRE_GROWTH: '1'
        run: |
          set -euo pipefail
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL is not configured."
            exit 1
          fi
          node scripts/smoke-production.mjs
