name: Provider smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '43 8 * * *'

jobs:
  eporner-api:
    runs-on: ubuntu-latest
    steps:
      - name: Verify official Eporner API contract
        run: |
          node <<'NODE'
          const url = new URL('https://www.eporner.com/api/v2/video/search/');
          url.searchParams.set('query', 'all');
          url.searchParams.set('per_page', '1');
          url.searchParams.set('page', '1');
          url.searchParams.set('thumbsize', 'big');
          url.searchParams.set('order', 'latest');
          url.searchParams.set('gay', '1');
          url.searchParams.set('lq', '0');
          url.searchParams.set('format', 'json');
          const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error(`provider status ${response.status}`);
          const data = await response.json();
          if (!Array.isArray(data.videos)) throw new Error('videos[] missing');
          if (data.videos[0] && !data.videos[0].id) throw new Error('video id missing');
          console.log(`Provider contract OK (${data.videos.length} result)`);
          NODE
