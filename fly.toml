app = "plantingtulips"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ADDR = ":8080"
  BASE_URL = "https://plantingtulips.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "8s"
    method = "GET"
    path = "/api/v1/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
